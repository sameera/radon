<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- A new build must be picked up on the next load, so neither the page nor its script is
             taken from a cache. The offline worker answers a failed load with the offline page. -->
        <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
        <meta http-equiv="Pragma" content="no-cache" />
        <meta http-equiv="Expires" content="0" />
        <!-- Scripts only from this address. Network calls only to this address, GitHub's API and the
             team's backend, which the build adds at the placeholder (G22). -->
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self'; connect-src 'self' https://api.github.com/*BACKEND*/; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://avatars.githubusercontent.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'"
        />
        <title>Raiden</title>
        <link rel="manifest" href="./manifest.webmanifest" />
        <link rel="icon" type="image/png" href="./raiden-128x.png" />
        <style>
            html, body { margin: 0; }
        </style>
    </head>
    <body>
        <script type="module" src="./main.js"></script>
    </body>
</html>
